name: Bump Cask Version

on:
  repository_dispatch:
    types: [bump-cask]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to bump to (e.g., 1.2.0). Leave empty to auto-detect latest release."
        required: false
        type: string

jobs:
  bump:
    name: Update Cask
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            VERSION="${{ github.event.client_payload.version }}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          fi

          if [[ -z "$VERSION" ]]; then
            echo "No version provided, fetching latest release..."
            VERSION=$(gh release view --repo koepalex/Crow-s-Nest-MQTT --json tagName --jq '.tagName')
          fi

          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not determine version"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Determined version: $VERSION"

      - name: Check if update is needed
        id: check
        run: |
          CURRENT=$(grep -oP 'version "\K[^"]+' Casks/crowsnestmqtt.rb)
          echo "Current version: $CURRENT"
          echo "New version: ${{ steps.version.outputs.version }}"
          if [[ "$CURRENT" == "${{ steps.version.outputs.version }}" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Version is already up to date."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download arm64 DMG and compute SHA256
        if: steps.check.outputs.skip == 'false'
        id: sha_arm64
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          URL="https://github.com/koepalex/Crow-s-Nest-MQTT/releases/download/${VERSION}/crows-nest-mqtt-osx-arm64-${VERSION}.dmg"
          echo "Downloading: $URL"
          curl -fSL -o arm64.dmg "$URL"
          HASH=$(sha256sum arm64.dmg | awk '{print $1}')
          echo "sha256=$HASH" >> "$GITHUB_OUTPUT"
          echo "arm64 SHA256: $HASH"
          rm arm64.dmg

      - name: Download x64 DMG and compute SHA256
        if: steps.check.outputs.skip == 'false'
        id: sha_x64
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          URL="https://github.com/koepalex/Crow-s-Nest-MQTT/releases/download/${VERSION}/crows-nest-mqtt-osx-x64-${VERSION}.dmg"
          echo "Downloading: $URL"
          curl -fSL -o x64.dmg "$URL"
          HASH=$(sha256sum x64.dmg | awk '{print $1}')
          echo "sha256=$HASH" >> "$GITHUB_OUTPUT"
          echo "x64 SHA256: $HASH"
          rm x64.dmg

      - name: Update cask file
        if: steps.check.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA_ARM64="${{ steps.sha_arm64.outputs.sha256 }}"
          SHA_X64="${{ steps.sha_x64.outputs.sha256 }}"

          sed -i "s/version \"[^\"]*\"/version \"${VERSION}\"/" Casks/crowsnestmqtt.rb
          sed -i "s/sha256 arm:   \"[^\"]*\"/sha256 arm:   \"${SHA_ARM64}\"/" Casks/crowsnestmqtt.rb
          sed -i "s/intel: \"[a-f0-9]*\"/intel: \"${SHA_X64}\"/" Casks/crowsnestmqtt.rb

          echo "Updated cask to version $VERSION"
          cat Casks/crowsnestmqtt.rb

      - name: Commit and push
        if: steps.check.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/crowsnestmqtt.rb
          git commit -m "Bump crowsnestmqtt to ${VERSION}"
          git push
