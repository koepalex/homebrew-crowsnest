name: Bump Cask Version

on:
  repository_dispatch:
    types: [bump-cask]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to bump to (e.g., 1.2.0). Leave empty to auto-detect latest release."
        required: false
        type: string

jobs:
  bump:
    name: Update Cask
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            VERSION="${{ github.event.client_payload.version }}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          fi

          if [[ -z "$VERSION" ]]; then
            echo "No version provided, fetching latest release..."
            VERSION=$(gh release view --repo koepalex/Crow-s-Nest-MQTT --json tagName --jq '.tagName')
          fi

          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not determine version"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Determined version: $VERSION"

      - name: Check if update is needed
        id: check
        run: |
          CURRENT=$(grep -oP 'version "\K[^"]+' Casks/crowsnestmqtt.rb)
          echo "Current version: $CURRENT"
          echo "New version: ${{ steps.version.outputs.version }}"
          if [[ "$CURRENT" == "${{ steps.version.outputs.version }}" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Version is already up to date."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download arm64 DMG and compute SHA256
        if: steps.check.outputs.skip == 'false'
        id: sha_arm64
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Downloading arm64 DMG for version $VERSION..."
          gh release download "$VERSION" \
            --repo koepalex/Crow-s-Nest-MQTT \
            --pattern "crows-nest-mqtt-osx-arm64-${VERSION}.dmg" \
            --dir .
          HASH=$(sha256sum "crows-nest-mqtt-osx-arm64-${VERSION}.dmg" | awk '{print $1}')
          echo "sha256=$HASH" >> "$GITHUB_OUTPUT"
          echo "arm64 SHA256: $HASH"
          rm "crows-nest-mqtt-osx-arm64-${VERSION}.dmg"

      - name: Download x64 DMG and compute SHA256
        if: steps.check.outputs.skip == 'false'
        id: sha_x64
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Downloading x64 DMG for version $VERSION..."
          gh release download "$VERSION" \
            --repo koepalex/Crow-s-Nest-MQTT \
            --pattern "crows-nest-mqtt-osx-x64-${VERSION}.dmg" \
            --dir .
          HASH=$(sha256sum "crows-nest-mqtt-osx-x64-${VERSION}.dmg" | awk '{print $1}')
          echo "sha256=$HASH" >> "$GITHUB_OUTPUT"
          echo "x64 SHA256: $HASH"
          rm "crows-nest-mqtt-osx-x64-${VERSION}.dmg"

      - name: Update cask file
        if: steps.check.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA_ARM64="${{ steps.sha_arm64.outputs.sha256 }}"
          SHA_X64="${{ steps.sha_x64.outputs.sha256 }}"

          sed -i "s/version \"[^\"]*\"/version \"${VERSION}\"/" Casks/crowsnestmqtt.rb
          sed -i "s/sha256 arm:   \"[^\"]*\"/sha256 arm:   \"${SHA_ARM64}\"/" Casks/crowsnestmqtt.rb
          sed -i "s/intel: \"[a-f0-9]*\"/intel: \"${SHA_X64}\"/" Casks/crowsnestmqtt.rb

          echo "Updated cask to version $VERSION"
          cat Casks/crowsnestmqtt.rb

      - name: Create pull request
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="bump-cask-${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add Casks/crowsnestmqtt.rb
          git commit -m "Bump crowsnestmqtt to ${VERSION}"
          git push origin "$BRANCH"

          gh pr create \
            --title "Bump crowsnestmqtt to ${VERSION}" \
            --body "Automated cask version bump to **${VERSION}**.

          This PR was created automatically after a new release was published in [Crow-s-Nest-MQTT](https://github.com/koepalex/Crow-s-Nest-MQTT/releases/tag/${VERSION}).

          **Merge this PR** once you have verified the release is published and the assets are publicly accessible." \
            --base main \
            --head "$BRANCH"
